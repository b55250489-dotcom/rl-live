<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overtime Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
</head>

<body>

<section id="loginScreen" class="login-screen">

<div class="login-card">

<div class="admin-logo">OT</div>

<span>OVERTIME</span>
<h1>Admin</h1>

<p>Sign in to manage Overtime.</p>

<form id="loginForm">
<label>Email</label>
<input id="loginEmail" type="email" required>

<label>Password</label>
<input id="loginPassword" type="password" required>

<button type="submit">SIGN IN</button>

<div id="loginError" class="form-error"></div>
</form>

<a href="index.html" class="back-site">← Return to Overtime</a>

</div>

</section>


<div id="adminApp" class="admin-app hidden">

<aside class="admin-sidebar">

<a href="index.html" class="admin-brand">
<div>OT</div>
<span><strong>OVERTIME</strong>ADMIN</span>
</a>

<nav>
<button class="admin-nav-button active" data-page="dashboard">Dashboard</button>
<button class="admin-nav-button" data-page="matches">Matches</button>
<button class="admin-nav-button" data-page="teams">Teams</button>
<button class="admin-nav-button" data-page="players">Players</button>
<button class="admin-nav-button" data-page="events">Events</button>
<button class="admin-nav-button" data-page="streams">Streams</button>
<button class="admin-nav-button" data-page="news">News</button>
<button class="admin-nav-button" data-page="standings">Standings</button>
<button class="admin-nav-button" data-page="settings">Site Settings</button>
</nav>

<div class="sidebar-bottom">
<a href="index.html">View Website ↗</a>
<button id="logoutButton">Sign Out</button>
</div>

</aside>


<main class="admin-main">

<header class="admin-header">
<div>
<span>OVERTIME CONTROL CENTER</span>
<h1 id="adminPageTitle">Dashboard</h1>
</div>

<button id="primaryAction" class="primary-action hidden">
+ ADD
</button>
</header>

<div id="adminContent"></div>

</main>

</div>


<div id="modal" class="modal hidden">

<div class="modal-backdrop" id="modalBackdrop"></div>

<div class="modal-card">

<div class="modal-header">
<h2 id="modalTitle">Add</h2>
<button id="closeModal">×</button>
</div>

<form id="entityForm">

<div id="formFields"></div>

<div class="modal-actions">
<button type="button" id="cancelModal">Cancel</button>
<button type="submit" class="save-button">Save</button>
</div>

</form>

</div>

</div>


<div id="toast" class="toast hidden"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/database.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
